name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['data/**', 'README.md', 'scripts/**', '.github/workflows/validate.yml']
  push:
    branches: [main]
    paths: ['data/**', 'README.md', 'scripts/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/atlas.mjs validate
      - run: node scripts/atlas.mjs check
      - run: node --test scripts/atlas.test.mjs

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/atlas.mjs links
